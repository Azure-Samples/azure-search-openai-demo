name: Frontend linting

on:
  push:
    branches: [ main ]
    paths:
      - "app/frontend/**"
  pull_request:
    branches: [ main ]
    paths:
      - "app/frontend/**"

jobs:
    prettier:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
            - name: Run prettier on frontend
              run: |
                cd ./app/frontend
                npm install
                npx prettier --check .
