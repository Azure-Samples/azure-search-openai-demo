version: 2
updates:

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns:
          - "*"
    cooldown:
      default-days: 7

  # Maintain dependencies for npm
  - package-ecosystem: "npm"
    directory: "/app/frontend"
    schedule:
      interval: "weekly"
    # Ignore Vite 7.x for now: Vite >=7 requires Node >=20.19.0 while project engines.node is currently >=20.0.0
    ignore:
      - dependency-name: "vite"
        versions:
          - ">=7.0.0"

  # Maintain dependencies for pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    ignore:
      - dependency-name: "pydantic-core"
      # Ignore quart >=0.21 for now: quart 0.21+ requires Python >=3.11 (0.23+ requires >=3.13), while the app supports Python 3.10
      - dependency-name: "quart"
        versions:
          - ">=0.21"
    groups:
      telemetry:
        patterns:
          - "opentelemetry-*"
          - "azure-monitor-opentelemetry*"
      pallets:
        patterns:
          - "flask"
          - "werkzeug"
          - "blinker"
          - "quart"
          - "jinja2"
          - "click"
          - "itsdangerous"
          - "markupsafe"
